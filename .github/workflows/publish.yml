name: publish
# Publishes to npm via Trusted Publishing (OIDC): no npm token is stored anywhere.
# Runs on any push to main and on manual dispatch; it skips when package.json's
# version already exists on npm. Release = bump "version" and merge to main.
#
# One-time setup on npmjs.com -> package rules-bench -> Settings -> Trusted Publisher:
#   GitHub Actions, owner ferhatatagun, repo rules-bench, workflow filename publish.yml
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing + provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER already on npm, skipping"; echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.publish == 'true'
        run: npm test
      - if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public
